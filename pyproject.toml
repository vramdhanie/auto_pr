[project]
name = "auto-pr"
version = "0.1.0"
description = "Review a GitHub pull request with Claude Code from the command line"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Vincent Ramdhanie", email = "vramdhanie@gmail.com" }]
dependencies = [
    "requests>=2.32",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.14",
]

[tool.uv]
# A command-line tool, not a library. Nothing imports this project.
package = false

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "B", "I", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The reviewer prompts are prose. Wrapping them at a column limit makes them
# harder to read and edit, and the model does not care about line length.
"prompts.py" = ["E501"]
